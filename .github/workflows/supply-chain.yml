name: Supply Chain

# Rebuild, scan, SBOM, push, sign and attest on every push to main.
# Pull requests get build + scan only (no push, no signatures):
# secrets are unavailable to fork PRs and nothing unsigned leaves CI.
on:
  push:
    branches: [main]
    # Docs-only changes skip the pipeline: no image to build, no digest
    # to sign. Any commit touching code/Dockerfile still runs the full flow.
    # Caveat (not currently applicable — main has no required status
    # checks): if this workflow ever becomes required, docs-only PRs
    # would wait on it forever. Revisit then.
    paths-ignore: ['**.md', '.gitignore', 'LICENSE*']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore', 'LICENSE*']
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # ambient OIDC for keyless cosign

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions pinned to immutable SHAs (OpenSSF/SLSA);
      # version comments for readability.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Short SHA and build date
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: quay.io/jwesterl/rhhi-cplusplus
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Pinned manual install: cosign-installer@v3's bootstrap still
      # looks for a legacy `.sig` asset, but v3 releases publish
      # `.sigstore.json` bundles instead (HTTP 404 -> exit 22). So pin
      # the binary and verify it against the published checksums file.
      # Trade-off, stated plainly: checksum-over-TLS, not a detached
      # signature check. Revisit when the installer supports v3 assets.
      - name: Install cosign v3.1.4 (pinned, checksum-verified)
        run: |
          V=v3.1.4
          cd /tmp
          curl -sSfL -O https://github.com/sigstore/cosign/releases/download/$V/cosign-linux-amd64
          curl -sSfL -o checksums.txt https://github.com/sigstore/cosign/releases/download/$V/cosign_checksums.txt
          sha256sum -c <(grep ' cosign-linux-amd64$' checksums.txt)
          sudo install -m755 /tmp/cosign-linux-amd64 /usr/local/bin/cosign
          cosign version

      # The Quay mirror is expected to be content-identical to
      # registry.access.redhat.com (same digests). Verify the signed
      # mirror, check parity for BOTH variants (the builder carries no
      # signature, so digest equality is its only check), and export the
      # pinned refs the build must consume — closing the TOCTOU gap
      # between verification and build.
      - name: Verify bases (RHHI Konflux key + digest parity)
        id: bases
        run: |
          cosign verify --key rhhi-cosign.pub --insecure-ignore-tlog \
            quay.io/hummingbird/core-runtime:latest
          mirror() { docker buildx imagetools inspect --raw "quay.io/hummingbird/$1" | sha256sum | cut -d' ' -f1; }
          upstream() { docker buildx imagetools inspect --raw "registry.access.redhat.com/hi/$1" | sha256sum | cut -d' ' -f1; }
          M_RT=$(mirror core-runtime:latest); U_RT=$(upstream core-runtime:latest)
          M_BD=$(mirror core-runtime:latest-builder); U_BD=$(upstream core-runtime:latest-builder)
          echo "runtime: mirror=$M_RT upstream=$U_RT"
          echo "builder: mirror=$M_BD upstream=$U_BD"
          test "$M_RT" = "$U_RT"
          test "$M_BD" = "$U_BD"
          echo "base_ref=registry.access.redhat.com/hi/core-runtime@$M_RT" >> "$GITHUB_OUTPUT"
          echo "builder_ref=registry.access.redhat.com/hi/core-runtime@$M_BD" >> "$GITHUB_OUTPUT"

      - name: Log in to Quay
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ env.SHORT_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BASE_IMAGE=${{ steps.bases.outputs.base_ref }}
            BUILDER_IMAGE=${{ steps.bases.outputs.builder_ref }}
          sbom: false
          provenance: false

      - name: Resolve scan reference
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=$(echo '${{ steps.meta.outputs.tags }}' | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "image=quay.io/jwesterl/rhhi-cplusplus@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Scan target: $(grep '^image=' "$GITHUB_OUTPUT" | cut -d= -f2-)"

      - name: SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.ref.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json

      # Pinned like cosign above: the install.sh pipe runs an unpinned
      # remote script as root, which this workflow's threat model doesn't
      # accept. Checksum verifies integrity (TLS transport), same caveat.
      - name: Install grype v0.121.1 (pinned, checksum-verified)
        run: |
          V=v0.121.1
          cd /tmp
          curl -sSfL -O https://github.com/anchore/grype/releases/download/$V/grype_${V#v}_linux_amd64.tar.gz
          curl -sSfL -o grype-checksums.txt https://github.com/anchore/grype/releases/download/$V/grype_${V#v}_checksums.txt
          sha256sum -c <(grep " grype_${V#v}_linux_amd64.tar.gz$" grype-checksums.txt)
          sudo tar -xzf grype_${V#v}_linux_amd64.tar.gz -C /usr/local/bin grype
          grype version

      - name: Vulnerability scan (grype)
        run: grype ${{ steps.ref.outputs.image }} -o json=vuln.grype.json

      # Gate on Critical only. Highs are VEX-acknowledged for this image
      # (see README: all current matches are known_affected upstream with
      # no available remediation) — failing on High would red-light every
      # build by design. Tighten when the threat model says so.
      - name: Gate on Critical vulnerabilities
        run: |
          python3 - <<'EOF'
          import json, sys
          ms = json.load(open('vuln.grype.json')).get('matches', [])
          crit = [m for m in ms if m.get('vulnerability', {}).get('severity') == 'Critical']
          print(f"matches={len(ms)} critical={len(crit)}")
          for m in crit:
              v, a = m['vulnerability'], m['artifact']
              print(f"CRITICAL {a['name']} {a['version']} {v['id']}")
          sys.exit(1 if crit else 0)
          EOF

      - name: Upload SBOM and scan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-and-scan-${{ env.SHORT_SHA }}
          path: |
            sbom.spdx.json
            vuln.grype.json

      - name: Sign image (keyless OIDC)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes ${{ steps.ref.outputs.image }}

      - name: Attest SBOM and scan (keyless OIDC)
        if: github.event_name != 'pull_request'
        run: |
          cosign attest --predicate sbom.spdx.json --type spdxjson --yes ${{ steps.ref.outputs.image }}
          cosign attest --predicate vuln.grype.json --type vuln --yes ${{ steps.ref.outputs.image }}
